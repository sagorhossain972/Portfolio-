<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaled Md Saifullah — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

/* ===============================
   🔥 PREMIUM REDESIGN (NO CONTENT CHANGE)
================================ */

:root {
    --bg-main:#030303;
    --bg-surface:rgba(20,20,20,.65);
    --bg-card:rgba(255,255,255,.05);

    --text-main:#f5efe3;
    --text-muted:#a7a29a;

    --accent-gold:#d6aa4f;
    --accent-gold-light:#f3d891;

    --border-subtle:rgba(255,255,255,.08);
    --border-hover:rgba(214,170,79,.5);

    --nav-height:76px;

    --font-serif:'Playfair Display',serif;
    --font-sans:'DM Sans',sans-serif;
    --font-mono:'DM Mono',monospace;
}

/* GLOBAL */
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:var(--font-sans);
    color:var(--text-main);
    background:
        radial-gradient(circle at 15% 10%, rgba(214,170,79,.18), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(82,97,255,.12), transparent 30%),
        #030303;
}

/* NAV */
nav{
    position:fixed;
    width:100%;
    height:var(--nav-height);
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border-subtle);
    display:flex;
    align-items:center;
    z-index:100;
}

.nav-content{
    display:flex;
    justify-content:space-between;
    width:100%;
    padding:0 5%;
}

.logo{
    font-family:var(--font-serif);
    font-size:1.4rem;
    font-weight:900;
}

.logo span{color:var(--accent-gold-light);}

.nav-links{display:flex;gap:20px;}

.nav-links a{
    font-size:.75rem;
    letter-spacing:.15em;
    color:var(--text-muted);
}

.nav-links a:hover{color:var(--accent-gold-light);}

/* HERO */
.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    padding-top:var(--nav-height);
}

.hero-layout{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:70px;
    width:90%;
    margin:auto;
}

.hero-title{
    font-size:clamp(4rem,8vw,7rem);
    font-weight:900;
    letter-spacing:-.06em;
    background:linear-gradient(135deg,#fff,#f3d891,#888);
    -webkit-background-clip:text;
    color:transparent;
}

.hero-subtitle{
    color:var(--accent-gold-light);
    font-family:var(--font-mono);
    letter-spacing:.2em;
}

.hero-desc{
    color:var(--text-muted);
    font-size:1.2rem;
    margin:20px 0;
}

/* CONTACT BADGES */
.hero-contact span,
.hero-contact a{
    border:1px solid var(--border-subtle);
    padding:8px 12px;
    border-radius:20px;
    margin:4px;
    display:inline-flex;
}

/* IMAGE */
.hero-image-wrapper{
    width:380px;
    height:480px;
    border-radius:30px;
    overflow:hidden;
    border:1px solid var(--border-subtle);
    box-shadow:0 40px 80px rgba(0,0,0,.6);
}

.hero-image-wrapper img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CARDS */
.timeline-content,
.project-card,
.skill-card,
.gallery-item,
.list-item{
    border-radius:20px;
    backdrop-filter:blur(15px);
    border:1px solid var(--border-subtle);
    background:var(--bg-surface);
    transition:.3s;
}

.timeline-content:hover,
.project-card:hover,
.skill-card:hover,
.gallery-item:hover{
    transform:translateY(-6px);
    border-color:var(--border-hover);
}

/* PROJECT */
.project-card{
    padding:25px;
}

.project-title{
    font-size:1.3rem;
    font-weight:700;
}

/* SKILLS */
.tag{
    border-radius:20px;
    padding:6px 12px;
}

/* GALLERY */
.gallery-item img{
    border-radius:14px;
}

/* SECTION */
.section{
    padding:110px 5%;
}

.section-title{
    font-size:2.8rem;
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    color:#666;
}

/* RESPONSIVE */
@media(max-width:900px){
    .hero-layout{grid-template-columns:1fr;text-align:center;}
}

</style>
</head>
